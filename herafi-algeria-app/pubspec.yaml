name: herafi_algeria
description: حرفي الجزائر - منصة ربط الزبائن بالحرفيين في الجزائر
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Firebase (Pinned to stable versions)
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_messaging: ^16.5.0
  firebase_storage: ^13.4.6

  # State
  flutter_riverpod: ^2.6.1

  # UI
  google_fonts: ^8.2.1

  # Utils
  http: ^1.6.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  equatable: ^2.1.0
  pinput: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
