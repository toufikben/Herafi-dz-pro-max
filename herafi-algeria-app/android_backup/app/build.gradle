plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace = "com.herafi.algeria"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.herafi.algeria"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"
        multiDexEnabled = true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    
    def flutterSdkPath = {
        def properties = new Properties()
        file("../local.properties").withInputStream { properties.load(it) }
        return properties.getProperty("flutter.sdk")
    }()
    
    implementation fileTree(dir: "$flutterSdkPath/bin/cache/artifacts/engine/android-arm64-release/", include: ["flutter.jar"])
}
